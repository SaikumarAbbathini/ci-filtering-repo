name: "CI Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run CI Command
        run: |
          echo "CI Pipeline executed successfully!"
          echo "Triggered by branch ref: ${{ github.ref }}"
